name: Scheduled production refresh

on:
  schedule:
    # A distinct schedule registration; the reusable job also supports manual recovery.
    # GitHub scheduling is best effort. Live verification enforces the quote age target.
    - cron: "3-58/5 12-23 * * 1-5"
    - cron: "19 6,16,18,22 * * 1-5"
    - cron: "19 6 * * 6"

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    uses: ./.github/workflows/refresh-data.yml
    with:
      mode: ${{ github.event.schedule == '3-58/5 12-23 * * 1-5' && 'quotes' || 'full' }}
    secrets: inherit
