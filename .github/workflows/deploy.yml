name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      data_only:
        description: Publish validated data only when application code matches a successful deployment
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Establish verified publication scope
        id: scope
        run: node scripts/deployment-scope.mjs
        env:
          DATA_ONLY_REQUESTED: ${{ inputs.data_only }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm test
        if: steps.scope.outputs.data_only != 'true'
      - run: npm run data:validate
      - run: npm run build
        # Served at the custom domain nexus.gygante.com, so the base path stays "/"
        # (public/CNAME rides along into dist/).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Finish the artifact upload before starting a fresh deployment job. This is
  # the Pages action's recommended layout and avoids immediate same-job lookup.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify live data, freshness and NexSI coverage
        run: node --import tsx scripts/verify-production.mjs
