name: Refresh data snapshots

on:
  schedule:
    - cron: "20 6 * * 1-5" # weekdays 06:20 UTC, after US close data settles
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to dispatch the deploy workflow after committing data

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/refresh-data.mjs
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      # Daily trust snapshot: signals + forecast digest + spot anchors → history/
      # (the tamper-evident track record the calibration scoreboard reads)
      - run: npx tsx scripts/snapshot-signals.ts
      - name: Commit updated snapshots
        id: commit
        run: |
          git config user.name "nexusq-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh snapshots $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pushes made with GITHUB_TOKEN do not trigger `on: push` workflows
      # (recursion prevention), so the deploy must be dispatched explicitly.
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
