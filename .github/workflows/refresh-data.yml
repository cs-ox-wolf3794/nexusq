name: Refresh data snapshots

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: full
  workflow_dispatch:
    inputs:
      mode:
        description: "Refresh scope"
        type: choice
        options: [full, quotes]
        default: full

permissions:
  contents: write
  actions: write

concurrency:
  group: nexusq-data-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Select refresh scope
        id: scope
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          echo "REFRESH_STARTED_AT=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
          if [ "$REQUESTED_MODE" = "quotes" ]; then
            echo "mode=quotes" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify analytical code
        if: steps.scope.outputs.mode == 'full'
        run: npm test && npx tsc -b
      - name: Install public membership PDF reader
        if: steps.scope.outputs.mode == 'full'
        run: python -m pip install pypdf==6.21.4
      - name: Refresh validated analytical snapshot
        id: data
        if: steps.scope.outputs.mode == 'full'
        continue-on-error: true
        run: npm run refresh
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      - name: Report NexSI source verification
        if: steps.scope.outputs.mode == 'full'
        continue-on-error: true
        run: node --import tsx scripts/report-nexsi-refresh.mjs
      - name: Refresh timestamped quotes
        id: quotes
        continue-on-error: true
        run: npm run refresh:quotes
      - name: Refresh indicative display exchange rate
        if: steps.scope.outputs.mode == 'quotes' || steps.data.outcome != 'success'
        run: node --import tsx scripts/refresh-fx.mjs
      - name: Record analytical refresh outcome
        if: steps.scope.outputs.mode == 'full'
        run: node scripts/record-refresh-status.mjs
        env:
          REFRESH_OUTCOME: ${{ steps.data.outcome }}
          REFRESH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Recompute event-study evidence
        if: steps.data.outcome == 'success'
        run: |
          npm run backtest
          node --import tsx --input-type=module -e "import { buildManifest } from './scripts/lib/snapshot.mjs'; await buildManifest('public/data');"
      - name: Append immutable daily ledger
        if: steps.data.outcome == 'success'
        run: npx tsx scripts/snapshot-signals.ts
      - name: Validate complete publication
        run: npm run data:validate -- --manifest
      - name: Commit verified update
        id: commit
        run: |
          git config user.name "nexusq-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh ${{ steps.scope.outputs.mode }} $(date -u +%FT%TZ)"
            # Never force push. A conflicting concurrent edit stops publication.
            git pull --rebase origin main
            npm run data:validate -- --manifest
            git add public/data/manifest.json
            if ! git diff --cached --quiet; then git commit -m "data: reconcile publication manifest"; fi
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy verified snapshots
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Surface refresh failure
        if: steps.data.outcome == 'failure' || steps.quotes.outcome == 'failure'
        run: |
          echo "::error::Refresh failed. Previous analytical snapshot retained; see public refresh status and source health."
          exit 1
