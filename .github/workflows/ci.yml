name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  watchdog-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ops/refresh-watchdog/package-lock.json
      - run: npm ci --prefix ops/refresh-watchdog
      - name: Verify the Cloudflare runtime without production credentials
        run: npm run test:runtime --prefix ops/refresh-watchdog
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Unit tests (analytics library)
        run: npx vitest run
      - name: Validate published data contracts
        run: npm run data:validate
      - name: Production build
        run: npm run build
